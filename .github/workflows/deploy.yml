# Vérifie, construit et publie le site statique sur Cloudflare Pages (projet « keurfoot »).
# EN ATTENTE du domaine keurfoot.com : pour l'instant, lancement à la main seulement (onglet Actions).
# Le jour où keurfoot.com est acheté : remettre les déclencheurs push et schedule ci-dessous,
# faire appeler ce fichier par maintenance.yml, puis supprimer pages.yml (voir README).
name: Publier le site

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  # Pour réactiver la tâche programmée (voir la dernière étape).
  actions: write

# Une seule publication à la fois ; on ne coupe pas une publication en cours.
concurrency:
  group: publication
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code (dernière version de main)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          persist-credentials: false

      - name: Installer Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier le code (lint + types)
        run: |
          npm run lint
          npm run typecheck

      - name: Lancer les tests
        run: npm test

      - name: Construire le site statique (dossier out/)
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://keurfoot.com
          NEXT_TELEMETRY_DISABLED: 1

      # Les secrets ne sont donnés qu'aux étapes qui en ont besoin (pas à l'installation ni au build).
      - name: Vérifier la présence des secrets Cloudflare
        id: secrets
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$HAS_TOKEN" = "true" ] && [ "$HAS_ACCOUNT" = "true" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Ajoutez les secrets CLOUDFLARE_API_TOKEN et CLOUDFLARE_ACCOUNT_ID pour publier le site."
          fi

      - name: Publier sur Cloudflare Pages
        if: steps.secrets.outputs.ok == 'true'
        env:
          # Réglés par le propriétaire dans Settings → Secrets and variables → Actions.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # wrangler est figé dans package-lock.json (installé par npm ci).
          # Crée le projet « keurfoot » à la première publication (sans effet s'il existe déjà).
          npx wrangler pages project create keurfoot --production-branch=main || true
          npx wrangler pages deploy out --project-name=keurfoot --branch=main --commit-dirty=true

      # GitHub coupe les tâches programmées d'un dépôt public après 60 jours sans activité :
      # chaque publication programmée réactive la tâche, pour que les articles continuent de paraître.
      - name: Garder la publication programmée active
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/deploy.yml/enable"
